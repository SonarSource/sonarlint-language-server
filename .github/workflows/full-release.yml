name: Full release

on:
  workflow_dispatch:
    inputs:
      short-description:
        description: 'A short description for the release ticket'
        required: true
        type: string
      branch:
        description: 'The branch from which to release.'
        required: false
        default: 'master'
        type: string

jobs:
  release:
    name: Release
    uses: SonarSource/release-github-actions/.github/workflows/ide-automated-release.yml@2a1e042a4d9084dd8298d999469851c412e56c43 # 1.9.17
    if: always() && !failure() && !cancelled()
    permissions:
      statuses: read
      id-token: write
      contents: write
      actions: write
      pull-requests: write
    with:
      jira-project-key: "SLLS"
      project-name: "SonarLint Language Server"
      short-description: ${{ inputs.short-description }}
      branch: ${{ inputs.branch }}
      slack-channel: "C04UA29K9HQ" #squad-ide-vscode-bots

  bump-version:
    name: Create a PR to bump version
    runs-on: github-ubuntu-latest-s
    needs:
      - release
    permissions:
      id-token: write # for SonarSource/ci-github-actions/config-maven
      contents: write # write for peter-evans/create-pull-request, read for actions/checkout
      pull-requests: write # write for peter-evans/create-pull-request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Resolve dependencies through Artifactory instead of hitting Maven Central directly (avoids HTTP 429)
      - uses: SonarSource/ci-github-actions/config-maven@cd228f1d8cd84e341efb928b19c5f1d3b62d5590 # 2.8.0
        env:
          # A provided value makes get-build-number skip its increment of the shared build_number property.
          # The Maven version update is already skipped, so this value is unused.
          BUILD_NUMBER: "0"
          CURRENT_VERSION: skip
          PROJECT_VERSION: skip
        with:
          artifactory-reader-role: private-reader
      - name: bump-version
        env:
          NEW_VERSION: ${{ needs.release.outputs.new-version }}
        run: |
          mvn versions:set -DgenerateBackupPoms=false -DnewVersion="$NEW_VERSION-SNAPSHOT"
          # config-maven leaves .actions/ symlinks (absolute runner paths) in the workspace;
          # remove them so create-pull-request's `git add -A` does not commit them
          rm -rf .actions .build_number.txt
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          author: ${{ github.actor }} <${{ github.actor }}>
          commit-message: Prepare next development iteration
          title: Prepare next development iteration
          branch: bot/bump-project-version
          branch-suffix: timestamp
          delete-branch: true
          base: ${{ inputs.branch }}
          draft: true # so that we don't actually need to re-open the PR and just make it ready for review
          reviewers: ${{ github.actor }}
          body: Bump the version for the new iteration. Created by release automation.
